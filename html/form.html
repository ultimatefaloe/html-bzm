<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Docs</title>
  </head>
  <body>
    <h1>Form Docs</h1>

    <div>
      <form>
        <div>
          <label for="f_name">First Name </label>
          <input type="text" value="" id="f_name" name="f_name" placeholder="John" required />
        </div>

        <div>
          <label for="l_name">Last Name </label>
          <input
            type="text"
            value=""
            id="l_name"
            name="l_name"
            placeholder="Doe"
            required
          />
        </div>

        <div>
          <label for="email">Email </label>
          <input
            type="email"
            value=""
            id="email"
            name="email"
            placeholder="Doe@gmail.com"
            required
          />
        </div>

        <div>
          <label for="phone">Phone </label>
          <input
            type="tel"
            value=""
            id="phone"
            name="phone"
            placeholder="08051274015"
            required
          />
        </div>

        <div>
          <label for="age">Age </label>
          <input
            type="number"
            value=""
            id="age"
            name="age"
            placeholder="12"
            required
          />
        </div>

        <div>
          <label for="data">Current Date </label>
          <input
            type="date"
            value=""
            id="date"
            name="date"
            placeholder="12"
            required
          />
        </div>

        <div>
           <label for="password">Current Date </label>
          <input
            type="password"
            value=""
            id="password"
            name="password"
            placeholder="**"
            required
          />
        </div>

        <div>
           <label for="password">Current Date </label>
          <input
            type="address"
            value=""
            id="password"
            name="password"
            placeholder="**"
            required
          />
        </div>

        <div>
          <button type="submit">Submit</button>
        </div>
      </form>
    </div>
  </body>
</html>
